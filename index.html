<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeverPrefix — Генератор пиксельных префиксов для Minecraft</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #0a0405;
    --panel: #150a0c;
    --panel2: #1c0d10;
    --border: #3a1519;
    --border2: #5a1f25;
    --accent: #ff0000;
    --text: #f3e6e7;
    --text2: #c9a3a6;
    --text3: #8a5f63;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,0,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: 0;
    pointer-events: none;
  }

  .wrapper { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
  header { text-align: center; margin-bottom: 40px; }

  .version {
    font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 3px;
    border: 1px solid var(--accent); padding: 2px 8px; display: inline-block; margin-bottom: 10px;
  }

  h1 {
    font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900;
    background: linear-gradient(to right, #fff, var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
  }

  .subtitle { color: var(--text2); font-size: 14px; margin-top: 5px; }

  .main-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
  @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border); padding: 24px;
    border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .panel-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent);
    margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
  }
  .panel-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .preview-section {
    grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;
    background: var(--panel2); padding: 40px;
  }

  .canvas-container {
    background-image:
      linear-gradient(45deg, #0a0a0a 25%, transparent 25%),
      linear-gradient(-45deg, #0a0a0a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #0a0a0a 75%),
      linear-gradient(-45deg, transparent 75%, #0a0a0a 75%);
    background-size: 10px 10px;
    padding: 30px; border: 2px solid #000; margin-bottom: 20px;
  }
  #mainCanvas { image-rendering: pixelated; }

  .input-group { margin-bottom: 20px; }
  label { display: block; font-size: 10px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; letter-spacing: 1px; }

  input[type="text"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border2); padding: 12px;
    color: #fff; font-family: inherit; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .color-input { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border2); padding: 5px 10px; }
  input[type="color"] { background: none; border: none; width: 30px; height: 30px; cursor: pointer; }
  .hex-val { font-size: 12px; margin-left: 10px; color: var(--text); }

  .presets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .preset-card {
    aspect-ratio: 16/9; cursor: pointer; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .preset-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .preset-card span { font-size: 8px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .ex-card {
    background: var(--bg); border: 1px solid var(--border); padding: 12px 6px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.2s;
  }
  .ex-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .ex-card canvas { image-rendering: pixelated; max-width: 100%; }
  .ex-card span { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }

  .btn-main {
    width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 12px;
    text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-top: 10px;
  }
  .btn-main:hover { background: #fff; color: #000; box-shadow: 0 0 20px rgba(255,0,0,0.5); }

  .btn-alt {
    width: 100%; padding: 12px; background: transparent; color: var(--accent);
    border: 1px solid var(--accent); font-family: 'Orbitron', sans-serif; font-size: 10px;
    text-transform: uppercase; cursor: pointer; margin-top: 10px;
  }
  .btn-alt:hover { background: var(--accent); color: #fff; }

  .btn-small {
    flex: 1; padding: 8px; background: var(--bg); color: var(--text2); border: 1px solid var(--border2);
    font-family: inherit; font-size: 10px; text-transform: uppercase; cursor: pointer;
  }
  .btn-small:hover { border-color: var(--accent); color: var(--accent); }

  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 10px 0; }

  .toggle-group { display: flex; background: var(--bg); border: 1px solid var(--border2); padding: 4px; }
  .toggle-btn { flex: 1; padding: 8px; font-size: 10px; background: none; border: none; color: var(--text3); cursor: pointer; text-transform: uppercase; font-family: inherit; }
  .toggle-btn.active { background: var(--border2); color: var(--accent); }

  .size-badge { font-size: 10px; color: var(--text3); margin-top: 10px; }

  /* ICONS */
  .icon-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .icon-btn {
    width: 38px; height: 38px; background: var(--bg); border: 1px solid var(--border2);
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 10px;
  }
  .icon-btn canvas { image-rendering: pixelated; width: 20px; height: 20px; }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.active { border-color: var(--accent); background: var(--border); }

  .editor-row { display: flex; gap: 16px; align-items: flex-start; }
  #iconEditor {
    display: grid; grid-template-columns: repeat(5, 30px); gap: 2px; padding: 2px;
    background: var(--border2); touch-action: none; user-select: none; flex-shrink: 0;
  }
  #iconEditor div { width: 30px; height: 30px; background: var(--bg); cursor: pointer; }
  #iconEditor div.on { background: var(--accent); }
  .editor-side { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .editor-hint { font-size: 10px; color: var(--text3); line-height: 1.5; }
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <h1>FeverPrefix</h1>
    <p class="subtitle">Генератор пиксельных префиксов для Minecraft</p>
  </header>

  <div class="main-grid">
    <!-- PREVIEW -->
    <div class="panel preview-section">
      <div class="panel-title">Результат</div>
      <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
      </div>
      <div style="display:flex; gap: 20px; align-items: center;">
        <canvas id="zoom4x" style="image-rendering:pixelated;"></canvas>
        <canvas id="zoom8x" style="image-rendering:pixelated;"></canvas>
      </div>
      <div class="size-badge" id="resInfo">Размер: 0x0 px</div>
    </div>

    <!-- LEFT: TEXT & COLORS -->
    <div class="panel">
      <div class="panel-title">Текст и Цвета</div>

      <div class="input-group">
        <label>Текст ранга (РУС/ENG)</label>
        <input type="text" id="inpText" value="АДМИН" maxlength="16">
      </div>

      <div class="color-grid">
        <div class="input-group">
          <label>Цвет 1</label>
          <div class="color-input"><input type="color" id="clr1" value="#ff0000"><div class="hex-val" id="hex1">#FF0000</div></div>
        </div>
        <div class="input-group">
          <label>Цвет 2</label>
          <div class="color-input"><input type="color" id="clr2" value="#7a0000"><div class="hex-val" id="hex2">#7A0000</div></div>
        </div>
      </div>

      <div class="input-group">
        <label>Направление градиента</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-g="dir" data-v="H" onclick="setDir('H', this)">Горизонтально</button>
          <button class="toggle-btn" data-g="dir" data-v="V" onclick="setDir('V', this)">Вертикально</button>
        </div>
      </div>

      <div class="color-grid">
        <div class="input-group">
          <label>Цвет текста</label>
          <div class="color-input"><input type="color" id="clrT" value="#ffffff"></div>
        </div>
        <div class="input-group">
          <label>Цвет тени</label>
          <div class="color-input"><input type="color" id="clrS" value="#000000"></div>
        </div>
      </div>

      <div class="panel-title" style="margin-top:10px">Обводка фона</div>
      <div class="color-grid">
        <div class="input-group">
          <label>Обводка</label>
          <div class="toggle-group">
            <button class="toggle-btn active" data-g="outline" data-v="true" onclick="setOutline(true, this)">Вкл</button>
            <button class="toggle-btn" data-g="outline" data-v="false" onclick="setOutline(false, this)">Выкл</button>
          </div>
        </div>
        <div class="input-group">
          <label>Цвет обводки</label>
          <div class="color-input"><input type="color" id="clrO" value="#000000"></div>
        </div>
      </div>

      <div class="panel-title" style="margin-top:10px">Иконка (слева от текста)</div>
      <div class="icon-presets" id="iconPresets"></div>

      <div class="editor-row">
        <div id="iconEditor"></div>
        <div class="editor-side">
          <div class="editor-hint">Рисуйте мышью или пальцем. Выберите готовую иконку и доработайте её.</div>
          <div style="display:flex; gap:6px">
            <button class="btn-small" onclick="iconClear()">Очистить</button>
            <button class="btn-small" onclick="iconInvert()">Инверсия</button>
          </div>
          <div class="color-input" style="margin-top:6px">
            <input type="color" id="clrI" value="#ffffff">
            <div class="hex-val">Цвет иконки</div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: SETTINGS & PRESETS -->
    <div class="panel">
      <div class="panel-title">Настройки и Пресеты</div>

      <div class="input-group">
        <label>Отступы (X: <span id="vPadH">4</span>, Y: <span id="vPadV">2</span>)</label>
        <input type="range" id="padH" min="1" max="10" value="4">
        <input type="range" id="padV" min="0" max="6" value="2">
      </div>

      <div class="color-grid">
        <div class="input-group">
          <label>Тень текста</label>
          <div class="toggle-group">
            <button class="toggle-btn active" data-g="shadow" data-v="true" onclick="setShadow(true, this)">Вкл</button>
            <button class="toggle-btn" data-g="shadow" data-v="false" onclick="setShadow(false, this)">Выкл</button>
          </div>
        </div>
        <div class="input-group">
          <label>Тень иконки</label>
          <div class="toggle-group">
            <button class="toggle-btn active" data-g="shadowIcon" data-v="true" onclick="setIconShadow(true, this)">Вкл</button>
            <button class="toggle-btn" data-g="shadowIcon" data-v="false" onclick="setIconShadow(false, this)">Выкл</button>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label>Смещение тени (X: <span id="vShX">1</span>, Y: <span id="vShY">1</span>)</label>
        <input type="range" id="shX" min="-3" max="3" value="1">
        <input type="range" id="shY" min="-3" max="3" value="1">
      </div>

      <div class="input-group">
        <label>Стиль углов</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-g="corner" data-v="round" onclick="setCorner('round', this)">Скругленные</button>
          <button class="toggle-btn" data-g="corner" data-v="sharp" onclick="setCorner('sharp', this)">Острые</button>
        </div>
      </div>

      <label>Готовые примеры префиксов</label>
      <div class="ex-grid" id="presetsArea"></div>

      <button class="btn-main" onclick="download()">СКАЧАТЬ PNG</button>
      <button class="btn-alt" onclick="downloadLarge()">СКАЧАТЬ x16 (HD)</button>
    </div>
  </div>
</div>

<script>
// --- ШРИФТ 5x5 (латиница + кириллица) ---
const FONT = {
  'A':[14,17,31,17,17],'B':[30,17,30,17,30],'C':[14,17,16,17,14],'D':[30,17,17,17,30],'E':[31,16,30,16,31],
  'F':[31,16,30,16,16],'G':[14,17,19,17,14],'H':[17,17,31,17,17],'I':[14,4,4,4,14],'J':[7,2,2,18,12],
  'K':[17,18,28,18,17],'L':[16,16,16,16,31],'M':[17,27,21,17,17],'N':[17,25,21,19,17],'O':[14,17,17,17,14],
  'P':[30,17,30,16,16],'Q':[14,17,17,18,13],'R':[30,17,30,18,17],'S':[15,16,14,1,30],'T':[31,4,4,4,4],
  'U':[17,17,17,17,14],'V':[17,17,17,10,4],'W':[17,17,21,27,17],'X':[17,10,4,10,17],'Y':[17,10,4,4,4],'Z':[31,2,4,8,31],
  'А':[14,17,31,17,17],'Б':[30,16,30,17,30],'В':[30,17,30,17,30],'Г':[31,16,16,16,16],'Д':[7,9,9,9,31],
  'Е':[31,16,30,16,31],'Ё':[21,0,31,16,31],'Ж':[21,21,14,21,21],'З':[30,1,14,1,30],'И':[17,19,21,25,17],
  'Й':[21,10,17,21,17],'К':[17,18,28,18,17],'Л':[7,9,9,9,9],'М':[17,27,21,17,17],'Н':[17,17,31,17,17],
  'О':[14,17,17,17,14],'П':[31,17,17,17,17],'Р':[30,17,30,16,16],'С':[14,16,16,16,14],'Т':[31,4,4,4,4],
  'У':[17,17,7,1,30],'Ф':[14,21,31,21,14],'Х':[17,10,4,10,17],'Ц':[17,17,17,31,1],'Ч':[17,17,15,1,1],
  'Ш':[17,17,17,17,31],'Щ':[17,17,17,31,1],'Ъ':[24,8,28,9,30],'Ы':[17,17,31,17,31],'Ь':[16,16,30,17,30],
  'Э':[14,1,15,1,14],'Ю':[18,18,30,18,18],'Я':[15,17,15,18,17],
  '0':[14,17,17,17,14],'1':[4,12,4,4,14],'2':[14,1,14,16,31],'3':[31,2,14,1,30],'4':[17,17,31,1,1],
  '5':[31,16,30,1,30],'6':[14,16,30,17,14],'7':[31,1,2,4,4],'8':[14,17,14,17,14],'9':[14,17,15,1,14],
  ' ':[0,0,0,0,0],'!':[4,4,4,0,4],'.':[0,0,0,0,4],':':[0,4,0,4,0]
};

// --- ЗАГОТОВЛЕННЫЕ ИКОНКИ 5x5 ---
const ICONS = [
  { n: '★', g: [4,31,14,14,17] },
  { n: '❅', g: [21,14,31,14,21] },
  { n: '⬥', g: [4,14,31,14,4] },
  { n: '♥', g: [10,31,31,14,4] },
  { n: '⚡', g: [6,12,31,6,12] },
  { n: '☠', g: [14,21,14,14,10] },
  { n: '♛', g: [21,21,31,31,31] },
  { n: '✚', g: [4,4,31,4,4] },
  { n: '☀', g: [21,14,27,14,21] },
  { n: '♪', g: [6,5,4,28,24] },
  { n: '🔥', g: [4,12,14,31,14] },
  { n: '⛨', g: [31,31,31,14,4] }
];

const ic = ch => ICONS.find(i => i.n === ch).g;

// Готовые примеры префиксов (можно добавлять свои)
const EXAMPLES = [
  { n: 'Админ',   text: 'АДМИН',   c1: '#ff0000', c2: '#7a0000', ct: '#ffffff', ci: '#ffd700', icon: ic('♛') },
  { n: 'VIP',     text: 'VIP',     c1: '#fbbf24', c2: '#b45309', ct: '#ffffff', ci: '#ffffff', icon: ic('★') },
  { n: 'Модер',   text: 'МОДЕР',   c1: '#0ea5e9', c2: '#0c4a6e', ct: '#ffffff', ci: '#e0f2fe', icon: ic('⛨') },
  { n: 'Хелпер',  text: 'ХЕЛПЕР',  c1: '#4ade80', c2: '#064e3b', ct: '#ffffff', ci: '#ffffff', icon: ic('✚') },
  { n: 'Owner',   text: 'OWNER',   c1: '#00f2ff', c2: '#7000ff', ct: '#ffffff', ci: '#ffffff', icon: ic('⬥'), dir: 'V' },
  { n: 'Зима',    text: 'ЗИМА',    c1: '#bae6fd', c2: '#1e3a8a', ct: '#ffffff', ci: '#ffffff', icon: ic('❅') },
  { n: 'Legend',  text: 'LEGEND',  c1: '#f97316', c2: '#7f1d1d', ct: '#fffbeb', ci: '#fde047', icon: ic('🔥'), corner: 'sharp' },
  { n: 'Toxic',   text: 'TOXIC',   c1: '#22c55e', c2: '#14532d', ct: '#f0fdf4', ci: '#bbf7d0', icon: ic('☠') },
  { n: 'Love',    text: 'LOVE',    c1: '#f472b6', c2: '#9d174d', ct: '#ffffff', ci: '#ffffff', icon: ic('♥') },
  { n: 'Player', text: 'PLAYER', c1: '#1e293b', c2: '#000000', ct: '#cbd5e1', icon: null, outline: false }
];

const BASE = { co: '#000000', cs: '#000000', ci: '#ffffff', outline: true, shadow: true, shadowIcon: true, shX: 1, shY: 1,
               padH: 4, padV: 2, dir: 'H', corner: 'round' };

const ICON_GAP = 2; // пикселей между иконкой и текстом

let state = {
  text: 'АДМИН', c1: '#ff0000', c2: '#7a0000', ct: '#ffffff', cs: '#000000', ci: '#ffffff',
  co: '#000000', outline: true, shadowIcon: true, shX: 1, shY: 1, padH: 4, padV: 2, dir: 'H', shadow: true, corner: 'round',
  icon: ICONS[0].g.slice()
};

// ---------- INIT ----------
function init() {
  // готовые примеры
  const area = document.getElementById('presetsArea');
  EXAMPLES.forEach(ex => {
    const st = Object.assign({}, state, BASE, ex, { icon: ex.icon ? ex.icon.slice() : null });
    const r = render(st);
    const c = document.createElement('canvas');
    c.width = r.w; c.height = r.h;
    c.getContext('2d').putImageData(new ImageData(r.out, r.w, r.h), 0, 0);
    c.style.width = r.w * 3 + 'px';
    const d = document.createElement('div');
    d.className = 'ex-card';
    d.appendChild(c);
    d.insertAdjacentHTML('beforeend', `<span>${ex.n}</span>`);
    d.onclick = () => applyExample(ex);
    area.appendChild(d);
  });

  // готовые иконки
  const ip = document.getElementById('iconPresets');
  const none = document.createElement('button');
  none.className = 'icon-btn'; none.textContent = '✕'; none.title = 'Без иконки';
  none.onclick = () => { state.icon = null; update(); };
  none.dataset.idx = 'none';
  ip.appendChild(none);
  ICONS.forEach((ic, i) => {
    const b = document.createElement('button');
    b.className = 'icon-btn'; b.title = ic.n; b.dataset.idx = i;
    const c = document.createElement('canvas'); c.width = 5; c.height = 5;
    const cx = c.getContext('2d'); cx.fillStyle = '#ff5a5a';
    for (let r = 0; r < 5; r++) for (let k = 0; k < 5; k++) if ((ic.g[r] >> (4 - k)) & 1) cx.fillRect(k, r, 1, 1);
    b.appendChild(c);
    b.onclick = () => { state.icon = ic.g.slice(); update(); };
    ip.appendChild(b);
  });

  // редактор иконки
  const ed = document.getElementById('iconEditor');
  for (let i = 0; i < 25; i++) { const c = document.createElement('div'); c.dataset.i = i; ed.appendChild(c); }
  let painting = false, paintVal = 1;
  const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.parentNode === ed ? el : null; };
  const setCell = (el, v) => {
    const i = +el.dataset.i, r = Math.floor(i / 5), k = i % 5;
    if (!state.icon) state.icon = [0,0,0,0,0];
    const bit = 1 << (4 - k);
    state.icon[r] = v ? (state.icon[r] | bit) : (state.icon[r] & ~bit);
    update();
  };
  ed.addEventListener('pointerdown', e => {
    const el = cellAt(e.clientX, e.clientY); if (!el) return;
    painting = true; paintVal = el.classList.contains('on') ? 0 : 1;
    setCell(el, paintVal); e.preventDefault();
  });
  ed.addEventListener('pointermove', e => {
    if (!painting) return;
    const el = cellAt(e.clientX, e.clientY); if (el) setCell(el, paintVal);
  });
  window.addEventListener('pointerup', () => painting = false);

  // слушатели
  inpText.oninput = e => { state.text = e.target.value.toUpperCase(); update(); };
  clr1.oninput = e => { state.c1 = e.target.value; update(); };
  clr2.oninput = e => { state.c2 = e.target.value; update(); };
  clrT.oninput = e => { state.ct = e.target.value; update(); };
  clrS.oninput = e => { state.cs = e.target.value; update(); };
  clrI.oninput = e => { state.ci = e.target.value; update(); };
  clrO.oninput = e => { state.co = e.target.value; update(); };
  shX.oninput = e => { state.shX = parseInt(e.target.value); update(); };
  shY.oninput = e => { state.shY = parseInt(e.target.value); update(); };
  padH.oninput = e => { state.padH = parseInt(e.target.value); update(); };
  padV.oninput = e => { state.padV = parseInt(e.target.value); update(); };

  update();
}

// ---------- TOGGLES ----------
function pick(btn) {
  btn.parentNode.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function setDir(d, btn) { state.dir = d; pick(btn); update(); }
function setShadow(v, btn) { state.shadow = v; pick(btn); update(); }
function setCorner(v, btn) { state.corner = v; pick(btn); update(); }
function setOutline(v, btn) { state.outline = v; pick(btn); update(); }
function setIconShadow(v, btn) { state.shadowIcon = v; pick(btn); update(); }

function syncToggles() {
  document.querySelectorAll('.toggle-btn[data-g]').forEach(b =>
    b.classList.toggle('active', String(state[b.dataset.g]) === b.dataset.v));
}

function applyExample(ex) {
  Object.assign(state, BASE, ex, { icon: ex.icon ? ex.icon.slice() : null });
  inpText.value = state.text;
  clr1.value = state.c1; clr2.value = state.c2; clrT.value = state.ct;
  clrS.value = state.cs; clrI.value = state.ci; clrO.value = state.co;
  padH.value = state.padH; padV.value = state.padV;
  shX.value = state.shX; shY.value = state.shY;
  syncToggles();
  update();
}

function iconClear() { state.icon = [0,0,0,0,0]; update(); }
function iconInvert() { state.icon = (state.icon || [0,0,0,0,0]).map(r => ~r & 31); update(); }

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3), 16), parseInt(hex.slice(3,5), 16), parseInt(hex.slice(5,7), 16)];
}

// ---------- DRAW ----------
function render(st) {
  const hasIcon = !!(st.icon && st.icon.some(r => r));
  const chars = [...st.text];
  const textW = chars.length ? chars.length * 6 - 1 : 0;
  const iconW = hasIcon ? 5 : 0;
  const gap = hasIcon && textW ? ICON_GAP : 0;

  const W = iconW + gap + textW + st.padH * 2;
  const H = 5 + st.padV * 2;

  const data = new Uint8ClampedArray(W * H * 4);
  const rgb1 = hexToRgb(st.c1), rgb2 = hexToRgb(st.c2);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (st.corner === 'round' && ((x === 0 || x === W - 1) && (y === 0 || y === H - 1))) continue;
      const i = (y * W + x) * 4;
      const t = st.dir === 'H' ? x / (W - 1 || 1) : y / (H - 1 || 1);
      data[i] = rgb1[0] + (rgb2[0] - rgb1[0]) * t;
      data[i+1] = rgb1[1] + (rgb2[1] - rgb1[1]) * t;
      data[i+2] = rgb1[2] + (rgb2[2] - rgb1[2]) * t;
      data[i+3] = 255;
    }
  }

  // иконка первая (слева), затем текст
  const items = [];
  let curX = st.padH;
  if (hasIcon) { items.push({ g: st.icon, x: curX, col: hexToRgb(st.ci), sh: st.shadowIcon }); curX += 5 + gap; }
  const rgbT = hexToRgb(st.ct);
  for (const ch of chars) { items.push({ g: FONT[ch] || FONT[' '], x: curX, col: rgbT, sh: st.shadow }); curX += 6; }

  const rgbS = hexToRgb(st.cs);
  const put = (px, py, c, a) => {
    if (px < 0 || py < 0 || px >= W || py >= H) return;
    const i = (py * W + px) * 4;
    data[i] = c[0]; data[i+1] = c[1]; data[i+2] = c[2]; data[i+3] = a;
  };
  const each = (fn, onlyShadow) => items.forEach(it => {
    if (onlyShadow && !it.sh) return;
    for (let r = 0; r < 5; r++) for (let k = 0; k < 5; k++)
      if ((it.g[r] >> (4 - k)) & 1) fn(it.x + k, st.padV + r, it.col);
  });
  each((px, py) => put(px + st.shX, py + st.shY, rgbS, 180), true);
  each((px, py, c) => put(px, py, c, 255));

  if (!st.outline) return { out: data, w: W, h: H };

  // обводка: +1 пиксель со всех сторон
  const oW = W + 2, oH = H + 2;
  const out = new Uint8ClampedArray(oW * oH * 4);
  const rgbO = hexToRgb(st.co);
  const filled = (x, y) => x >= 0 && y >= 0 && x < W && y < H && data[(y * W + x) * 4 + 3] > 0;
  for (let y = 0; y < oH; y++) {
    for (let x = 0; x < oW; x++) {
      const sx = x - 1, sy = y - 1, i = (y * oW + x) * 4;
      if (filled(sx, sy)) {
        const j = (sy * W + sx) * 4;
        out[i] = data[j]; out[i+1] = data[j+1]; out[i+2] = data[j+2]; out[i+3] = data[j+3];
      } else if (filled(sx - 1, sy) || filled(sx + 1, sy) || filled(sx, sy - 1) || filled(sx, sy + 1)) {
        out[i] = rgbO[0]; out[i+1] = rgbO[1]; out[i+2] = rgbO[2]; out[i+3] = 255;
      }
    }
  }
  return { out, w: oW, h: oH };
}

function draw() {
  const canvas = document.getElementById('mainCanvas');
  const r = render(state);
  canvas.width = r.w; canvas.height = r.h;
  canvas.getContext('2d').putImageData(new ImageData(r.out, r.w, r.h), 0, 0);
  canvas.style.width = r.w * 2 + 'px';

  resInfo.innerText = `Размер: ${r.w}x${r.h} px`;
  hex1.innerText = state.c1.toUpperCase();
  hex2.innerText = state.c2.toUpperCase();
  vPadH.innerText = state.padH;
  vPadV.innerText = state.padV;
  vShX.innerText = state.shX;
  vShY.innerText = state.shY;
  syncIconUI();
  scalePreview(canvas, 'zoom4x', 4);
  scalePreview(canvas, 'zoom8x', 8);
}

function syncIconUI() {
  const cells = document.querySelectorAll('#iconEditor div');
  cells.forEach((c, i) => {
    const r = Math.floor(i / 5), k = i % 5;
    c.classList.toggle('on', !!(state.icon && (state.icon[r] >> (4 - k)) & 1));
  });
  const cur = state.icon ? state.icon.join(',') : '';
  const empty = !state.icon || !state.icon.some(r => r);
  document.querySelectorAll('#iconPresets .icon-btn').forEach(b => {
    const idx = b.dataset.idx;
    b.classList.toggle('active', idx === 'none' ? empty : (!empty && ICONS[idx].g.join(',') === cur));
  });
}

function scalePreview(src, targetId, scale) {
  const t = document.getElementById(targetId);
  t.width = src.width * scale; t.height = src.height * scale;
  const ctx = t.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(src, 0, 0, t.width, t.height);
}

function update() { draw(); }

function fileName(suffix) {
  return `feverprefix_${state.text.toLowerCase().replace(/\s+/g, '_') || 'rank'}${suffix}.png`;
}

function download() {
  const link = document.createElement('a');
  link.download = fileName('');
  link.href = document.getElementById('mainCanvas').toDataURL();
  link.click();
}

function downloadLarge() {
  const src = document.getElementById('mainCanvas');
  const temp = document.createElement('canvas');
  const scale = 16;
  temp.width = src.width * scale; temp.height = src.height * scale;
  const ctx = temp.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(src, 0, 0, temp.width, temp.height);
  const link = document.createElement('a');
  link.download = fileName('_x16');
  link.href = temp.toDataURL();
  link.click();
}

window.onload = init;
</script>
</body>
